environment: qa

server:
  host: 0.0.0.0
  port: 4004
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

database:
  host: ${DATABASE_HOST}
  port: 5432
  user: ${DATABASE_USER}
  password: ${DATABASE_PASSWORD}
  db_name: pharmacy_db
  schema: pharmacy
  sslmode: require
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

jwt:
  secret: ${JWT_SECRET}
  access_token_duration: 15m
  issuer: "farmanexo-pharmacy-service"

redis:
  host: ${REDIS_HOST}
  port: 6379
  password: ${REDIS_PASSWORD}
  db: 0
  max_retries: 3
  pool_size: 10

aws:
  region: us-east-1
  endpoint: ""

sqs:
  pharmacy_events_queue_url: ${SQS_PHARMACY_EVENTS_URL}
  catalog_events_queue_url: ${SQS_CATALOG_EVENTS_URL}

s3:
  pharmacies_bucket: "farmanexo-pharmacies"

log:
  level: info
  encoding: json
